---
# ROS to GZ
# Tutorial Stuff
- ros_topic_name: "/diff_drive/cmd_vel"
  gz_topic_name: "/model/diff_drive/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Drive commands
- ros_topic_name: "/Direction/BackLeft"
  gz_topic_name: "/Direction/BackLeft"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
- ros_topic_name: "/Direction/BackRight"
  gz_topic_name: "/Direction/BackRight"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
- ros_topic_name: "/Direction/FrontRight"
  gz_topic_name: "/Direction/FrontRight"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
- ros_topic_name: "/Direction/FrontLeft"
  gz_topic_name: "/Direction/FrontLeft"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Arm commands (ROS -> GZ). Radians, except rail_joint in meters.
- ros_topic_name: "/arm/rail_joint/cmd_pos"
  gz_topic_name: "/model/arm/joint/rail_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/arm/shoulder_joint/cmd_pos"
  gz_topic_name: "/model/arm/joint/shoulder_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/arm/elbow_joint/cmd_pos"
  gz_topic_name: "/model/arm/joint/elbow_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/arm/forearm_roll_joint/cmd_pos"
  gz_topic_name: "/model/arm/joint/forearm_roll_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
- ros_topic_name: "/arm/wrist_pitch_joint/cmd_pos"
  gz_topic_name: "/model/arm/joint/wrist_pitch_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
